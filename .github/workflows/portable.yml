name: Portable CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-transaction:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test installer upgrade and rollback
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $output = Join-Path $env:RUNNER_TEMP 'uspp-installer-test.exe'
          & $compiler /nologo /target:exe /main:InstallerTransaction /reference:System.Windows.Forms.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll "/out:$output" installer\Setup.cs tests\InstallerTransaction.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $output
          exit $LASTEXITCODE
  unix:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # pyspng's bundled zlib otherwise replaces the SDK's fdopen declaration.
            export CFLAGS="${CFLAGS:-} -Dfdopen=fdopen"
          fi
          python -m pip install -r requirements-dev.txt
      - name: Build native compression library
        run: python native/build.py
      - name: Check Rosetta native library architecture
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          if arch -x86_64 /usr/bin/python3 -c 'import platform; assert platform.machine() == "x86_64"' 2>/dev/null; then
            arch -x86_64 /usr/bin/python3 native/build.py
            lipo -archs native/bin/libfast-lzma2.dylib | grep -w x86_64
            python native/build.py
            lipo -archs native/bin/libfast-lzma2.dylib | grep -w arm64
          else
            echo 'Rosetta Python is unavailable on this runner; architecture checks use native runners.'
          fi
      - name: Test source
        run: |
          python -m unittest discover -s tests -q
          node --test tests/raster_capture.test.js
      - name: Build CLI and plugin bundles
        run: python build.py
      - name: Test extracted portable archive
        run: python tests/portable_smoke.py spp_downgrader/dist/uspp_tool-${{ matrix.platform }}.tar.gz --native-trash --plugin spp_downgrader/dist/universal_spp_plugin-*-${{ matrix.platform }}.zip
      - name: Upload native bundles
        uses: actions/upload-artifact@v4
        with:
          name: uspp-${{ matrix.platform }}
          path: |
            spp_downgrader/dist/uspp_tool-${{ matrix.platform }}.tar.gz
            spp_downgrader/dist/universal_spp_plugin-*-${{ matrix.platform }}.zip
          if-no-files-found: error
